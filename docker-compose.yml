services:
  db:
    image: mysql:8.0
    container_name: reviews_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: sistema_reviews
      MYSQL_USER: reviews_user
      MYSQL_PASSWORD: reviews_pass
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"   
    volumes:
      - db_data:/var/lib/mysql
      - ./Banco:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 força conexão por rede (TCP). Com "localhost" o teste passava ainda durante
      # a criação inicial do banco, quando o MySQL só aceita conexões locais, e a API
      # subia antes da hora.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Servidor de e-mail de teste: recebe os e-mails da API e mostra em
  # http://localhost:8025 (nenhum e-mail sai de verdade para a internet)
  mailpit:
    image: axllent/mailpit:latest
    container_name: reviews_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  api:
    build: ./Back
    container_name: reviews_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - path: ./Back/.env
        required: false
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: reviews_user
      DB_PASSWORD: reviews_pass
      DB_NAME: sistema_reviews
      # E-mails de recuperação de senha vão para o Mailpit.
      # Para usar um SMTP real, apague estas duas linhas e preencha SMTP_* no Back/.env
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"

volumes:
  db_data:
