services:
  db:
    image: mysql:8.0
    container_name: reviews_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: sistema_reviews
      MYSQL_USER: reviews_user
      MYSQL_PASSWORD: reviews_pass
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"   
    volumes:
      - db_data:/var/lib/mysql
      - ./Banco:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./Back
    container_name: reviews_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./Back/.env
        required: false
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: reviews_user
      DB_PASSWORD: reviews_pass
      DB_NAME: sistema_reviews
    ports:
      - "3000:3000"

volumes:
  db_data:
