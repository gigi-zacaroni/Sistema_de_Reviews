$kind: http-example
name: http://localhost:3000/auth/login
request:
  url: http://localhost:3000/usuarios
  method: GET
  body:
    type: json
    content: "   {\r

      \     \"email\": \"admin@reviews.com\",\r

      \     \"senha\": \"Admin@12345\"\r

      \   }"
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    content-type: application/json; charset=utf-8
    content-length: "79"
    etag: W/"4f-gdh+aWMsIe+gdCFx8Gh6YxOoOjw"
    date: Sun, 18 Oct 2026 15:30:39 GMT
    connection: keep-alive
    keep-alive: timeout=5
  body:
    type: json
    content: |-
      {
        "erro": "Token não informado. Use o cabeçalho Authorization: Bearer <token>"
      }
order: 1000
